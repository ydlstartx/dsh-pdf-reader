# pnpm 11 requires every dependency lifecycle script to be reviewed. The
# protobufjs postinstall is optional for this browser-only plugin.
allowBuilds:
  protobufjs: false

# Keep pnpm 11's default 24-hour supply-chain delay. Every Harness package this
# plugin pins has been published for longer than that, so no exemption is
# needed; add one only for a release that must be adopted on day zero.
minimumReleaseAge: 1440
